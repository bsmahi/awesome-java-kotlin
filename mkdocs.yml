site_name: Awesome Java & Kotlin
site_description: Curated Java and Kotlin resources
site_url: https://bsmahi.github.io/awesome-java-kotlin/

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - attr_list

nav:
  - Home: index.md
  - Java: java/index.md
  - Spring: spring/index.md
  - Testing: testing/index.md
  - Build Tools: build-tools/index.md
  - Cloud: cloud/index.md
  - AI: ai/index.md
  - Kotlin: kotlin/index.md
  - JVM: jvm/index.md