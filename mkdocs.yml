site_name: Awesome Java & Kotlin
site_description: Curated Java and Kotlin resources
site_url: https://bsmahi.github.io/awesome-java-kotlin/

theme:
  name: material

  font:
    text: Roboto
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.footer

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bsmahi/awesome-java-kotlin
      name: GitHub Repository

    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/mahendra-rao-bandaru-8754432b
      name: Connect on LinkedIn

copyright: Copyright &copy; 2026 Mahendra Rao B

markdown_extensions:
  - attr_list

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span

  - pymdownx.superfences

nav:
  - Home: index.md
  - Java: java/index.md
  - Spring: spring/index.md
  - Testing: testing/index.md
  - Build Tools: build-tools/index.md
  - Cloud: cloud/index.md
  - AI: ai/index.md
  - Kotlin: kotlin/index.md
  - JVM: jvm/index.md